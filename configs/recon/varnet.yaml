recon_type: varnet
num_cascades: 12
chans: 18
pools: 4
anatomy_conditioning: false  # feed the anatomy label to every cascade
film_conditioning: false  # FiLM on each cascade bottleneck, driven by condition_classes
prompt_conditioning: false  # PromptMR-style prompt at every decoder level, mixed by the features and the class embedding
label_blind: false  # build the conditioning but feed every sample class 0: the anatomy-blind control
dc_mode: where  # where | multiply (multiply lets mask gradients flow through DC, ref = full k-space)
dc_weight_map: false  # learned DC weight per k-space location in every cascade, as NV-Raw2Insights-MRI; false = one scalar per cascade
adaptive_input: false  # condition every cascade's U-Net on A^H A x, A^H y and a carried latent, as PromptMR+
momentum_history: 0  # >0: PromptMR+'s momentum layer at every decoder level over this many earlier cascades (PromptMR+: num_cascades - 1)
backbone: unet  # unet (fastMRI) | promptmr (PromptMR+ CAB U-Net with prompts; needs pools: 3, chans: 48 for PromptMR+'s widths)
csme: false  # true: every cascade estimates its sensitivity maps from its current per-coil image, starting from the zero-filled image; false = external maps
checkpoint_cascades: false  # recompute cascades in backward to save memory
compile_unet: false  # torch.compile each cascade's real-valued U-Nets (unet or promptmr backbone, and the csme estimator); the complex FFT/DC code stays eager
unet_precision: bf16  # fp32 | bf16: autocast dtype of the cascade U-Nets (their input normalisation, the FFTs and DC stay fp32); bf16 vs fp32 at 2 cascades, 3 seeds: brain -0.03 dB, knee +0.01 dB
restrict_to_extent: false  # true: the regularizer writes only inside the acquired k-space extent (data without a kspace_support); VarNets trained without it lose ~1.5 dB on FLAIR if confined at eval
