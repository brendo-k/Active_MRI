defaults:
  - recon: unet
  - datasets: fastmri_local_v1_flair_knee  # raw fastMRI subset under /export/scratch/bkadota/fastmri_raw; the old ~/data/fastmri trees were deleted 2026-10-27
  - _self_

training:
  num_step: 1
  batch_size: 4
  num_epochs: 50
  lr: 0.001
  lr_step_size: 40
  lr_gamma: 0.1
  lr_scheduler: step  # step | constant | cosine | warmup_cosine
  lr_warmup_epochs: 2  # warmup_cosine only
  weight_decay: 0.0
  optimizer: muon  # adam | muon: Muon (orthogonalised momentum) on the U-Nets' hidden convolutions, Adam on everything else. Muon + LayerNorm is the default since 2026-11-04, measured on VarNet + LOUPE at R=8 only (reports/muon_layer_speed/report.md); the earlier default is training.optimizer=adam recon.norm=instance sampler.sens_norm=instance training.channels_last_unets=false
  muon_lr: null  # lr of the Muon group; null = training.lr (Muon's update RMS is matched to Adam's)
  muon_momentum: 0.95
  fused_adam: true  # Adam's one-kernel implementation: the same update, without a Python and kernel launch per tensor
  grad_clip_norm: 1.0  # per-group global-norm clip of the gradients; PromptMR+ trains with 0.01
  limit_batches: 1.0
  data_parallel: false
  compile_unets: true  # torch.compile every U-Net body (VarNet cascades, sensitivity net); ~1 min of compiling at the start, needs gcc/g++
  channels_last_unets: sens  # with compile_unets: false | true | sens. Inductor lays the U-Nets (sens: the sensitivity net alone) out channels-last, so no cuDNN NCHW<->NHWC transposes. InstanceNorm gets slower that way, and the cascades' 18 and 36 channels pay a padding kernel; sens helps with LayerNorm
  cudnn_benchmark: true  # cuDNN times its conv algorithms for each new input shape and keeps the fastest; false = its heuristic pick
  train_masked_metrics_every: 1  # train/PSNR_Masked and train/SSIM_Masked from every Nth train batch (validation scores every batch)
  train_metrics_every: 10  # every train-batch metric (PSNR/SSIM/NMSE, masked and per anatomy) from every Nth batch only (1 = every batch); they cost ~0.2 s of a ~1.45 s R=8 step and the training is bitwise the same (reports/varnet_train_speed)
  val_every: 1  # validate every Nth epoch and at the last; the best_model.pt choice only sees validated epochs
  early_stop_patience: 0  # >0: stop after this many validations in a row without a new best val loss (best_model.pt keeps the peak); logs "Early stop after epoch N"
  ema_decay: 0.0  # >0: EMA of the reconstructor and sensitivity-net weights, saved as ema_model.pt at the end of training; it does not change the trajectory, and the mask stays at its online value
  visualize_every: 10  # images (PNG panels, wandb images, fixed val examples) every Nth epoch and at the last (1 = every epoch); off-epochs skip the per-forward host copies too
  seed: 42

loss:
  loss_type: l1
  uncertainty_loss: false
  uncertainty_weight: 0.0
  anatomy_weight: 0.0

sampler:
  model: SequentialSampling
  accelerations: [4.0]
  budget_over: acquired  # R counts each slice's acquired k-space (FLAIR fills ~64% of the 320 grid); grid = R of the whole grid, as runs before 2026-10-28
  coil_combine: sense  # sampler input image: sense = sum conj(S) x coil image (phase-random: the RSS loss leaves the maps' common phase free) | rss = RSS of the coil images
  sense_mask_method: null  # body multiply on the sensitivity maps: null = none | pre_network = hard zero outside the RSS of the 10x10 centre | post_network = outside the RSS of the U-Net output. null beat pre_network by 1.26 dB PSNR_Masked (1 seed, 12-cascade VarNet, R=8): reports/sense_mask_varnet/report.md
  sampler_type: conv_2d  # conv_2d | conv_1d | loupe_2d | loupe_1d | caipi_2d | poisson_2d | autosamp_2d | mnet_2d
  slope: 10
  mask_grad_floor: 0.0  # straight_through only: floor on the mask sigmoid's backward derivative (LOUPE and conv samplers), as a fraction of its peak (0 = exact)
  ste_grad_floor: 0.0   # straight_through only: same, for the straight-through surrogate sigmoid(5 * (p - u))
  mask_draws: 1  # straight_through only: K draws per slice with stratified thresholds (u + k/K mod 1), losses averaged; batch is tiled K times, so memory is K x
  selection: bernoulli  # loupe_2d straight_through: bernoulli draws, or dcm = deterministic top-M of a VD prior minus the learned map (Sun et al., TCI 2024)
  dcm_vd_power: 4.0  # selection=dcm: exponent p of the acceptance prior ((D - r) / D)^p
  dcm_tau: 5.0  # selection=dcm: softmax temperature of the straight-through backward
  logit_limit: 6.0  # conv_2d: scores soft-clamped to +/- this before the sigmoid (p floor = sigmoid(-limit))
  logit_leak: 0.01  # conv_2d: slope of the score beyond the clamp, the gradient kept for pinned locations
  adapt_grid: 16  # smooth_adapt_2d: side of the coarse offset grid predicted from the calibration (0 = a bounded LOUPE mask)
  adapt_hidden: 64  # smooth_adapt_2d: width of the offset predictor (bank_adapt_2d: of the gate)
  bank_size: 8  # bank_adapt_2d: number of learned masks the calibration-block gate blends
  gate_temperature: 1.0  # bank_adapt_2d: gate logits are divided by this before the softmax (>1 flattens the weights)
  gate_lr: null  # bank_adapt_2d: lr of the gate network (the bank's masks keep training.lr); null = same lr for everything
  gate_logit_limit: 0.0  # bank_adapt_2d: >0 bounds the gate logits to +/- this (tanh), so no bank mask's weight can vanish
  init_mask_checkpoint: null  # loupe_2d / smooth_adapt_2d: start every class's mask from this loupe_2d run's mask (trainable)
  loupe_vd_init_power: 0.0  # loupe_2d straight-through: >0 starts the mask at the budget-matched VD prior clamp(c ((D - r) / D)^p, 0.01, 0.99) instead of uniform noise
  loupe_same_start: false  # per-anatomy loupe masks: every anatomy's mask starts from the first one's random draw (the shared mask's, at the same seed)
  lr: null  # lr of the sampler's parameters when it differs from training.lr
  adapt_head_lr: 1.0e-4  # smooth_adapt_2d: lr of the offset predictor (the base mask keeps sampler.lr)
  chans: 64  # first-conv width of the conv_2d sampler U-Net (doubles per depth)
  depth: 4  # down/up-sampling stages of the conv_2d sampler U-Net
  head: none  # conv_2d/mnet_2d location-specific head on the U-Net scores: none, bias (a learned per-location logit, as in LOUPE), mlp (bias plus a 256-wide MLP over the score map) or encoder_mlp (a per-location, zero-batch-mean term from an MLP on the U-Net bottleneck; no static bias)
  head_mlp_lr: 1.0e-4  # head=mlp/encoder_mlp: lr of the head's MLP alone; its 16.8M-weight first layer diverges at training.lr
  image_input: null  # conv_2d/mnet_2d: feed the IFFT of the under-sampled k-space (the zero-filled image) to the sampler instead of k-space; null = true for those samplers
  caipi_keep_fraction: 1.0  # caipi_2d only: keep the leftmost fraction of columns (0.75 = 6/8 partial Fourier)
  caipi_accel_y: 2  # caipi_2d only: every accel_y-th row sampled
  caipi_accel_z: 2  # caipi_2d only: every accel_z-th column within a sampled row (R = accel_y * accel_z)
  preselect_num: 10
  mask_train_mode: straight_through  # or 'reinforce'/'random' (loupe_2d/loupe_1d only)
  reinforce_weight: 1.0
  reinforce_entropy_weight: 0.0  # bonus for keeping the mask distribution spread out (discourages premature collapse)
  reinforce_normalize_advantages: false  # normalize advantage to unit std per group, for more consistent update scale
  reinforce_group_size: 0  # mask draws per slice, each group with its own baseline (batch_size = slices * group_size); 0 = whole batch is one slice
  reinforce_vd_power: 0.0  # >0 starts the REINFORCE policy from a variable-density prior (log p = -power*log(r+0.05)); 0 = near-uniform random init
  reinforce_eval: sample  # reinforce only: val mask = seeded draw from the policy (sample, matches training) | top-k logits (topk)
  reinforce_lr: null  # learning rate for the mask logits alone; null = training.lr
  autosamp_init: uniform  # autosamp_2d only: starting positions, uniform | normal (variable density, AutoSamp's truncated normal)
  autosamp_lr: 0.01  # autosamp_2d only: learning rate of the sample positions alone, in grid cells per step (AutoSamp's lr_enc)
  autosamp_kernel_sigma_start: 0.0  # autosamp_2d only: >0 takes the positions' gradient from a Gaussian surrogate of this width (cells), annealed to the end width; 0 = bilinear surrogate. The forward mask is always hard
  autosamp_kernel_sigma_end: 1.0  # autosamp_2d only: width the surrogate anneals to geometrically; below ~1 the boundary trap returns (start ~4 removes it)
  autosamp_anneal_fraction: 0.8  # autosamp_2d only: fraction of training spent annealing, after which the positions freeze and the recon fine-tunes on the fixed mask
  ppo_policy: null  # PPOTrainer checkpoint: its frozen deterministic policy picks every mask (use with loupe_2d as the placeholder sampler)
  fixed_mask_path: null  # saved [H, W] binary mask (centre included) used for every slice; only the reconstructor trains (use with loupe_2d as the placeholder sampler)
  mnet_accept: q_check  # mnet_2d only: q_check = train the sampler on a refined mask only if it beats the sampler's own mask (and random); always = train on every one
  mnet_compare_random: true  # mnet_2d, q_check: the refined mask must also beat a random mask scored by the frozen warm-start reconstructor (needs output.pretrained_recon trained on random masks)
  mnet_rollback: true  # mnet_2d, q_check: a rejected batch also reverts the reconstructor update made while refining the mask
  mnet_degeneracy_fallback: true  # mnet_2d: refine from random masks when over half the batch's mnet masks are identical
  mnet_label_binarize: threshold  # mnet_2d: mask-backward feeds the reconstructor threshold (label probability > 0.5, as the paper; the count floats, the final label is budgeted) or topk (exact budget every iteration)
  mnet_random_retry: false  # mnet_2d: if the refined mask does not beat the mnet mask, roll back and refine again from a random mask (the official code's remedy)
  mnet_label_steps: 20  # mnet_2d: mask-backward iterations per batch (T)
  mnet_sampler_steps: 40  # mnet_2d: sampler updates on the accepted labels per batch (c)
  mnet_sparsity_weight: 2.0e-5  # mnet_2d: weight of the L1 norm of the label mask in mask-backward (alpha)
  mnet_consistency_weight: 0.05  # mnet_2d: weight of the mean BCE tying the label mask to the sampler's output in mask-backward (lambda)
  mnet_init_margin: 0.1  # mnet_2d: label logits start at +margin on the mnet mask's locations, -margin elsewhere
  mnet_label_lr: 0.02  # mnet_2d: lr of the label logits in mask-backward; null = training.lr. Adam moves a logit about lr per step, so lr * mnet_label_steps must reach 2 * mnet_init_margin for any location to swap
  freeze_recon: false  # freeze reconstructor+sensetivity_net, train only the sampler
  fixed_mask_checkpoints: null  # {brain: ckpt, knee: ckpt}: copy each loupe_2d checkpoint's mask into that anatomy's slot and freeze it (with anatomy_conditioning: true)
  with_recon: false
  with_gfactor: false
  gfactor_replicas: 16
  sens_upsample_method: conv  # sensitivity U-Net upsampling: conv (transposed conv) | bilinear | max
  sens_conv_after_upsample: false
  sens_resolution: null  # N: run the sensitivity U-Net on the NxN centre of k-space and upsample its output; null = full resolution
  sens_norm: layer  # instance | layer | channel_layer | batch | none: normalisation after every sensitivity U-Net conv
  sens_precision: bf16  # fp32 | bf16: autocast dtype of the sensitivity U-Net body (its input normalisation and the RSS normalisation stay float32); bf16 vs fp32 at 2 cascades, 3 seeds: no loss (reports/unet_speed_varnet2_r8/eval_sens_bf16.json)
  uncertainty_mode: none
  anatomy_conditioning: false  # feed the anatomy label to the sampler

output:
  out_dir: checkpoints
  run_name: null  # wandb run name; null = built from the settings that differ from the baseline (activemri/training/run_naming.py)
  checkpoint: null
  pretrained_recon: null  # load reconstructor+sensetivity_net weights from this checkpoint, sampler stays fresh

misc:
  random_rotate: false
  phase_scramble_std: 0.0  # >0: random smooth phase (radians) on every coil image, fresh per train batch, fixed-seed for val
  phase_scramble_band: [6.0, 16.0]  # cycles/FOV; above the sensitivity net's +-5 centre bandwidth
  resolution: [256, 256]

hydra:
  run:
    dir: ${output.out_dir}
