defaults:
  - recon: unet
  - datasets: brain
  - _self_

training:
  num_step: 1
  batch_size: 4
  num_epochs: 50
  lr: 0.001
  lr_step_size: 40
  lr_gamma: 0.1
  weight_decay: 0.0
  limit_batches: 1.0
  data_parallel: false
  seed: 42

loss:
  loss_type: l1
  uncertainty_loss: false
  uncertainty_weight: 0.0
  anatomy_weight: 0.0

sampler:
  model: SequentialSampling
  accelerations: [4.0]
  sampler_type: conv_2d  # conv_2d | conv_1d | loupe_2d | loupe_1d
  slope: 5
  preselect_num: 10
  with_recon: false
  with_gfactor: false
  gfactor_replicas: 16
  uncertainty_mode: none

output:
  out_dir: checkpoints
  checkpoint: null

misc:
  random_rotate: false
  resolution: [128, 128]

hydra:
  run:
    dir: ${output.out_dir}
