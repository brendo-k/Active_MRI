# Brain AXT2 + knee PD/PDFS of the fastMRI local subset v1 (fastmri_local_v1_base.yaml), the same data as
# brain_knee_balanced.
# Before 2026-10-27 this config read ~/data/fastmri with balance_by: condition, i.e. equal slices for brain, knee-PD and
# knee-PDFS. The manifest's equal volume counts (80 T2, 40 PD, 40 PDFS) already give about that.
# Set condition_classes: [brain, knee-PD, knee-PDFS] to condition on the protocol.
defaults:
  - fastmri_local_v1_base
  - _self_
classes: [T2, knee]
anatomy: [brain, knee]
num_coils: 20
num_workers: 8
