# brain_knee_balanced as it was before 2026-10-27: the old directory loader over <data_root>/multicoil_brain/T2/{train,val}
# and <data_root>/multicoil_knee. Equal train/val slices for brain and knee, with knee split by volume.
# Kept for CoreHPC launchers, which must pass datasets.data_root. The local copy of this layout was deleted
# (configs/datasets/legacy_fastmri_splits).
anatomy: [brain, knee]
data_root: ???
data_dir: null
contrast: T2
num_coils: 16
num_workers: 8
balance: true  # equal train/val slices per anatomy; knee is split by volume
condition_classes: []  # per-sample conditioning labels, e.g. [brain, knee-PD, knee-PDFS]; empty = use anatomy
train_anatomies: []  # train on this subset only, still validating on every anatomy; empty = all
train_slices: null  # with train_anatomies, train slices per trained anatomy instead of the balanced count
sense_cache_dir: null  # BART ecalib maps cached by scripts/data/build_sense_cache.py; when set, the model uses them instead of the sensitivity net
test_fraction: 0.0  # fraction of each anatomy's volumes held out of train and val (see held_out_test_volumes); 0 = none
trim_to_smallest: true  # with balance: false keeps every volume instead of trimming each group to the smallest group's slice count
