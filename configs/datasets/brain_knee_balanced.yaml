# Brain AXT2 + knee PD/PDFS of the fastMRI local subset v1 (fastmri_local_v1_base.yaml).
# Before 2026-10-27 this config read other volumes, from ~/data/fastmri (configs/datasets/legacy_fastmri_splits), with
# balance: true, i.e. equal train and val slices for brain and knee.
# The manifest balances volumes instead: 80 T2 + 40 PD + 40 PDFS train volumes, giving 1222 / 1369 / 1349 train slices.
# That is about equal per condition, so knee as a whole has about 2.2x brain's slices.
# CoreHPC runs that still use the old directory layout use brain_knee_balanced_legacy.
defaults:
  - fastmri_local_v1_base
  - _self_
classes: [T2, knee]
anatomy: [brain, knee]
num_coils: 20
num_workers: 8
