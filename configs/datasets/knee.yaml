# Knee PD + PDFS of the fastMRI local subset v1 (fastmri_local_v1_base.yaml): 40 + 40 train and 20 + 20 val volumes.
# Before 2026-10-27 this config read other volumes, from ~/data/fastmri/multicoil_knee
# (configs/datasets/legacy_fastmri_splits).
defaults:
  - fastmri_local_v1_base
  - _self_
classes: [knee]
anatomy: [knee]
num_coils: 15
num_workers: 4
