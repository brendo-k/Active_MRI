# Brain AXT2 of the fastMRI local subset v1 (fastmri_local_v1_base.yaml): 80 train and 40 val volumes.
# Before 2026-10-27 this config read other volumes, from ~/data/fastmri/multicoil_brain/T2
# (configs/datasets/legacy_fastmri_splits).
defaults:
  - fastmri_local_v1_base
  - _self_
classes: [T2]
anatomy: [brain]
num_coils: 20
num_workers: 4
