hydra:
  run:
    dir: ${output.out_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.job.name=train_sequential
    - hydra.mode=RUN
    task:
    - recon=varnet
    - datasets=fastmri_local_v1_flair
    - training.batch_size=16
    - training.seed=42
    - sampler.accelerations=[8.0]
    - training.num_step=4
    - training.num_epochs=1
    - training.lr_step_size=90
    - recon.num_cascades=6
    - recon.chans=18
    - recon.checkpoint_cascades=true
    - sampler.preselect_num=10
    - sampler.anatomy_conditioning=false
    - output.run_name=F_4_s42_fscr1_tS5
    - sampler.sampler_type=seqmri_2d
    - sampler.seqmri_input_scale=signed_log
    - training.save_epochs=[10]
    - datasets.train_tier=S
    - datasets.train_slice_stride=5
    - misc.resolution=[320,320]
    - sampler.budget_over=acquired
    - datasets.limit_volumes=1
    - datasets.roots.hpc="~/scratch/data/fastmri/{anatomy}/data"
    - datasets.roots.local_batch2="~/scratch/data/fastmri/knee/data"
    - datasets.val_half=dev
    - output.out_dir=/home/remote/bkadota/scratch/multistep_adaptivity/validate/3090319/F_4_s42_fscr1_tS5
    - training.limit_batches=0.1
  job:
    name: train_sequential
    chdir: null
    override_dirname: ${hydra_override_dirname:}
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.4.0.dev6
    version_base: '1.4'
    cwd: /mnt/scratch/user/bkadota/multistep_adaptivity/code
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/scratch/user/bkadota/multistep_adaptivity/code/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/remote/bkadota/scratch/multistep_adaptivity/validate/3090319/F_4_s42_fscr1_tS5
    choices:
      datasets: fastmri_local_v1_flair
      recon: varnet
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
